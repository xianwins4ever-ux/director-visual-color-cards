<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#C62828;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.95" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="400" fill="url(#bg)"/>
  
  <!-- 标题区 -->
  <text x="40" y="60" fill="white" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="28" font-weight="bold">琳恩·拉姆塞</text>
  <text x="40" y="90" fill="rgba(255,255,255,0.7)" font-family="Arial, sans-serif" font-size="16">LynneRamsay</text>
  <text x="40" y="115" fill="rgba(255,255,255,0.5)" font-family="'Noto Sans CJK SC', sans-serif" font-size="12">09_浪漫柔光与复古色调 · 苏格兰 · 1969-</text>

  <!-- 主色 1 -->
  <rect x="40.0" y="160" width="118.0" height="80" fill="#C62828" filter="url(#shadow)"/>
  <text x="100.0" y="190" fill="#ffffff" font-family="Arial, monospace" font-size="11" text-anchor="middle" font-weight="bold">#C62828</text>
  <text x="100.0" y="210" fill="#ffffff" font-family="'Noto Sans CJK SC', sans-serif" font-size="10" text-anchor="middle">暴力红</text>
  <text x="100.0" y="225" fill="#ffffff" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" opacity="0.8">22%</text>

  <!-- 主色 2 -->
  <rect x="160.0" y="160" width="118.0" height="80" fill="#37474F" filter="url(#shadow)"/>
  <text x="220.0" y="190" fill="#ffffff" font-family="Arial, monospace" font-size="11" text-anchor="middle" font-weight="bold">#37474F</text>
  <text x="220.0" y="210" fill="#ffffff" font-family="'Noto Sans CJK SC', sans-serif" font-size="10" text-anchor="middle">格拉斯哥灰</text>
  <text x="220.0" y="225" fill="#ffffff" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" opacity="0.8">20%</text>

  <!-- 主色 3 -->
  <rect x="280.0" y="160" width="118.0" height="80" fill="#FFD54F" filter="url(#shadow)"/>
  <text x="340.0" y="190" fill="#000000" font-family="Arial, monospace" font-size="11" text-anchor="middle" font-weight="bold">#FFD54F</text>
  <text x="340.0" y="210" fill="#000000" font-family="'Noto Sans CJK SC', sans-serif" font-size="10" text-anchor="middle">记忆金</text>
  <text x="340.0" y="225" fill="#000000" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" opacity="0.8">16%</text>

  <!-- 主色 4 -->
  <rect x="400.0" y="160" width="118.0" height="80" fill="#5D4037" filter="url(#shadow)"/>
  <text x="460.0" y="190" fill="#ffffff" font-family="Arial, monospace" font-size="11" text-anchor="middle" font-weight="bold">#5D4037</text>
  <text x="460.0" y="210" fill="#ffffff" font-family="'Noto Sans CJK SC', sans-serif" font-size="10" text-anchor="middle">黑暗棕</text>
  <text x="460.0" y="225" fill="#ffffff" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" opacity="0.8">14%</text>

  <!-- 主色 5 -->
  <rect x="520.0" y="160" width="118.0" height="80" fill="#1A237E" filter="url(#shadow)"/>
  <text x="580.0" y="190" fill="#ffffff" font-family="Arial, monospace" font-size="11" text-anchor="middle" font-weight="bold">#1A237E</text>
  <text x="580.0" y="210" fill="#ffffff" font-family="'Noto Sans CJK SC', sans-serif" font-size="10" text-anchor="middle">深夜蓝</text>
  <text x="580.0" y="225" fill="#ffffff" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" opacity="0.8">14%</text>

  <!-- 主色 6 -->
  <rect x="640.0" y="160" width="118.0" height="80" fill="#000000" filter="url(#shadow)"/>
  <text x="700.0" y="190" fill="#ffffff" font-family="Arial, monospace" font-size="11" text-anchor="middle" font-weight="bold">#000000</text>
  <text x="700.0" y="210" fill="#ffffff" font-family="'Noto Sans CJK SC', sans-serif" font-size="10" text-anchor="middle">深黑</text>
  <text x="700.0" y="225" fill="#ffffff" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" opacity="0.8">14%</text>

  <text x="400.0" y="275" fill="rgba(255,255,255,0.8)" font-family="'Noto Sans CJK SC', sans-serif" font-size="13" text-anchor="middle">情绪色板</text>

  <circle cx="310.0" cy="310.0" r="20.0" fill="#C62828" filter="url(#shadow)"/>
  <text x="310.0" y="348" fill="rgba(255,255,255,0.8)" font-family="'Noto Sans CJK SC', sans-serif" font-size="10" text-anchor="middle">暴力创伤</text>

  <circle cx="370.0" cy="310.0" r="20.0" fill="#37474F" filter="url(#shadow)"/>
  <text x="370.0" y="348" fill="rgba(255,255,255,0.8)" font-family="'Noto Sans CJK SC', sans-serif" font-size="10" text-anchor="middle">压抑阴郁</text>

  <circle cx="430.0" cy="310.0" r="20.0" fill="#FFD54F" filter="url(#shadow)"/>
  <text x="430.0" y="348" fill="rgba(255,255,255,0.8)" font-family="'Noto Sans CJK SC', sans-serif" font-size="10" text-anchor="middle">记忆闪光</text>

  <circle cx="490.0" cy="310.0" r="20.0" fill="#5D4037" filter="url(#shadow)"/>
  <text x="490.0" y="348" fill="rgba(255,255,255,0.8)" font-family="'Noto Sans CJK SC', sans-serif" font-size="10" text-anchor="middle">黑暗心理</text>

  <text x="400.0" y="375" fill="rgba(255,255,255,0.6)" font-family="'Noto Sans CJK SC', sans-serif" font-size="11" text-anchor="middle">拉姆塞血红 / 暴力诗意思 / 主观碎片色 / 暴力诗意 / 心理创伤</text>
</svg>