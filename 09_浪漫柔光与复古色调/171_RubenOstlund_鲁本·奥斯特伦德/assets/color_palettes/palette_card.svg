<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#78909C;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#546E7A;stop-opacity:0.95" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="400" fill="url(#bg)"/>
  
  <!-- 标题区 -->
  <text x="40" y="60" fill="white" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="28" font-weight="bold">鲁本·奥斯特伦德</text>
  <text x="40" y="90" fill="rgba(255,255,255,0.7)" font-family="Arial, sans-serif" font-size="16">RubenOstlund</text>
  <text x="40" y="115" fill="rgba(255,255,255,0.5)" font-family="'Noto Sans CJK SC', sans-serif" font-size="12">09_浪漫柔光与复古色调 · 瑞典 · 1974-</text>

  <!-- 主色 1 -->
  <rect x="40.0" y="160" width="118.0" height="80" fill="#78909C" filter="url(#shadow)"/>
  <text x="100.0" y="190" fill="#000000" font-family="Arial, monospace" font-size="11" text-anchor="middle" font-weight="bold">#78909C</text>
  <text x="100.0" y="210" fill="#000000" font-family="'Noto Sans CJK SC', sans-serif" font-size="10" text-anchor="middle">北欧灰</text>
  <text x="100.0" y="225" fill="#000000" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" opacity="0.8">20%</text>

  <!-- 主色 2 -->
  <rect x="160.0" y="160" width="118.0" height="80" fill="#FFFFFF" filter="url(#shadow)"/>
  <text x="220.0" y="190" fill="#000000" font-family="Arial, monospace" font-size="11" text-anchor="middle" font-weight="bold">#FFFFFF</text>
  <text x="220.0" y="210" fill="#000000" font-family="'Noto Sans CJK SC', sans-serif" font-size="10" text-anchor="middle">雪国白</text>
  <text x="220.0" y="225" fill="#000000" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" opacity="0.8">18%</text>

  <!-- 主色 3 -->
  <rect x="280.0" y="160" width="118.0" height="80" fill="#0288D1" filter="url(#shadow)"/>
  <text x="340.0" y="190" fill="#ffffff" font-family="Arial, monospace" font-size="11" text-anchor="middle" font-weight="bold">#0288D1</text>
  <text x="340.0" y="210" fill="#ffffff" font-family="'Noto Sans CJK SC', sans-serif" font-size="10" text-anchor="middle">峡湾蓝</text>
  <text x="340.0" y="225" fill="#ffffff" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" opacity="0.8">16%</text>

  <!-- 主色 4 -->
  <rect x="400.0" y="160" width="118.0" height="80" fill="#8D6E63" filter="url(#shadow)"/>
  <text x="460.0" y="190" fill="#ffffff" font-family="Arial, monospace" font-size="11" text-anchor="middle" font-weight="bold">#8D6E63</text>
  <text x="460.0" y="210" fill="#ffffff" font-family="'Noto Sans CJK SC', sans-serif" font-size="10" text-anchor="middle">木棕</text>
  <text x="460.0" y="225" fill="#ffffff" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" opacity="0.8">14%</text>

  <!-- 主色 5 -->
  <rect x="520.0" y="160" width="118.0" height="80" fill="#2E7D32" filter="url(#shadow)"/>
  <text x="580.0" y="190" fill="#ffffff" font-family="Arial, monospace" font-size="11" text-anchor="middle" font-weight="bold">#2E7D32</text>
  <text x="580.0" y="210" fill="#ffffff" font-family="'Noto Sans CJK SC', sans-serif" font-size="10" text-anchor="middle">冷杉绿</text>
  <text x="580.0" y="225" fill="#ffffff" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" opacity="0.8">14%</text>

  <!-- 主色 6 -->
  <rect x="640.0" y="160" width="118.0" height="80" fill="#546E7A" filter="url(#shadow)"/>
  <text x="700.0" y="190" fill="#ffffff" font-family="Arial, monospace" font-size="11" text-anchor="middle" font-weight="bold">#546E7A</text>
  <text x="700.0" y="210" fill="#ffffff" font-family="'Noto Sans CJK SC', sans-serif" font-size="10" text-anchor="middle">冷蓝灰</text>
  <text x="700.0" y="225" fill="#ffffff" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" opacity="0.8">18%</text>

  <text x="400.0" y="275" fill="rgba(255,255,255,0.8)" font-family="'Noto Sans CJK SC', sans-serif" font-size="13" text-anchor="middle">情绪色板</text>

  <circle cx="310.0" cy="310.0" r="20.0" fill="#78909C" filter="url(#shadow)"/>
  <text x="310.0" y="348" fill="rgba(255,255,255,0.8)" font-family="'Noto Sans CJK SC', sans-serif" font-size="10" text-anchor="middle">阶级冷漠</text>

  <circle cx="370.0" cy="310.0" r="20.0" fill="#FFFFFF" filter="url(#shadow)"/>
  <text x="370.0" y="348" fill="rgba(255,255,255,0.8)" font-family="'Noto Sans CJK SC', sans-serif" font-size="10" text-anchor="middle">北欧冷静</text>

  <circle cx="430.0" cy="310.0" r="20.0" fill="#0288D1" filter="url(#shadow)"/>
  <text x="430.0" y="348" fill="rgba(255,255,255,0.8)" font-family="'Noto Sans CJK SC', sans-serif" font-size="10" text-anchor="middle">自然辽阔</text>

  <circle cx="490.0" cy="310.0" r="20.0" fill="#546E7A" filter="url(#shadow)"/>
  <text x="490.0" y="348" fill="rgba(255,255,255,0.8)" font-family="'Noto Sans CJK SC', sans-serif" font-size="10" text-anchor="middle">尴尬不安</text>

  <text x="400.0" y="375" fill="rgba(255,255,255,0.6)" font-family="'Noto Sans CJK SC', sans-serif" font-size="11" text-anchor="middle">北欧冷灰 / 雪国白色 / 奥斯特伦德冷调 / 阶级批判 / 尴尬美学</text>
</svg>