<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F48FB1;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0.95" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="400" fill="url(#bg)"/>
  
  <!-- 标题区 -->
  <text x="40" y="60" fill="white" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="28" font-weight="bold">索菲亚·科波拉</text>
  <text x="40" y="90" fill="rgba(255,255,255,0.7)" font-family="Arial, sans-serif" font-size="16">SofiaCoppola</text>
  <text x="40" y="115" fill="rgba(255,255,255,0.5)" font-family="'Noto Sans CJK SC', sans-serif" font-size="12">09_浪漫柔光与复古色调 · 美国 · 1971-</text>

  <!-- 主色 1 -->
  <rect x="40.0" y="160" width="118.0" height="80" fill="#F48FB1" filter="url(#shadow)"/>
  <text x="100.0" y="190" fill="#000000" font-family="Arial, monospace" font-size="11" text-anchor="middle" font-weight="bold">#F48FB1</text>
  <text x="100.0" y="210" fill="#000000" font-family="'Noto Sans CJK SC', sans-serif" font-size="10" text-anchor="middle">少女粉</text>
  <text x="100.0" y="225" fill="#000000" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" opacity="0.8">20%</text>

  <!-- 主色 2 -->
  <rect x="160.0" y="160" width="118.0" height="80" fill="#78909C" filter="url(#shadow)"/>
  <text x="220.0" y="190" fill="#000000" font-family="Arial, monospace" font-size="11" text-anchor="middle" font-weight="bold">#78909C</text>
  <text x="220.0" y="210" fill="#000000" font-family="'Noto Sans CJK SC', sans-serif" font-size="10" text-anchor="middle">迷失灰</text>
  <text x="220.0" y="225" fill="#000000" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" opacity="0.8">18%</text>

  <!-- 主色 3 -->
  <rect x="280.0" y="160" width="118.0" height="80" fill="#FFCC80" filter="url(#shadow)"/>
  <text x="340.0" y="190" fill="#000000" font-family="Arial, monospace" font-size="11" text-anchor="middle" font-weight="bold">#FFCC80</text>
  <text x="340.0" y="210" fill="#000000" font-family="'Noto Sans CJK SC', sans-serif" font-size="10" text-anchor="middle">暖金</text>
  <text x="340.0" y="225" fill="#000000" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" opacity="0.8">16%</text>

  <!-- 主色 4 -->
  <rect x="400.0" y="160" width="118.0" height="80" fill="#90CAF9" filter="url(#shadow)"/>
  <text x="460.0" y="190" fill="#000000" font-family="Arial, monospace" font-size="11" text-anchor="middle" font-weight="bold">#90CAF9</text>
  <text x="460.0" y="210" fill="#000000" font-family="'Noto Sans CJK SC', sans-serif" font-size="10" text-anchor="middle">东京蓝</text>
  <text x="460.0" y="225" fill="#000000" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" opacity="0.8">14%</text>

  <!-- 主色 5 -->
  <rect x="520.0" y="160" width="118.0" height="80" fill="#BA68C8" filter="url(#shadow)"/>
  <text x="580.0" y="190" fill="#000000" font-family="Arial, monospace" font-size="11" text-anchor="middle" font-weight="bold">#BA68C8</text>
  <text x="580.0" y="210" fill="#000000" font-family="'Noto Sans CJK SC', sans-serif" font-size="10" text-anchor="middle">玛丽紫</text>
  <text x="580.0" y="225" fill="#000000" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" opacity="0.8">14%</text>

  <!-- 主色 6 -->
  <rect x="640.0" y="160" width="118.0" height="80" fill="#FFFFFF" filter="url(#shadow)"/>
  <text x="700.0" y="190" fill="#000000" font-family="Arial, monospace" font-size="11" text-anchor="middle" font-weight="bold">#FFFFFF</text>
  <text x="700.0" y="210" fill="#000000" font-family="'Noto Sans CJK SC', sans-serif" font-size="10" text-anchor="middle">纯白</text>
  <text x="700.0" y="225" fill="#000000" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" opacity="0.8">18%</text>

  <text x="400.0" y="275" fill="rgba(255,255,255,0.8)" font-family="'Noto Sans CJK SC', sans-serif" font-size="13" text-anchor="middle">情绪色板</text>

  <circle cx="310.0" cy="310.0" r="20.0" fill="#F48FB1" filter="url(#shadow)"/>
  <text x="310.0" y="348" fill="rgba(255,255,255,0.8)" font-family="'Noto Sans CJK SC', sans-serif" font-size="10" text-anchor="middle">少女忧伤</text>

  <circle cx="370.0" cy="310.0" r="20.0" fill="#78909C" filter="url(#shadow)"/>
  <text x="370.0" y="348" fill="rgba(255,255,255,0.8)" font-family="'Noto Sans CJK SC', sans-serif" font-size="10" text-anchor="middle">迷失孤独</text>

  <circle cx="430.0" cy="310.0" r="20.0" fill="#FFCC80" filter="url(#shadow)"/>
  <text x="430.0" y="348" fill="rgba(255,255,255,0.8)" font-family="'Noto Sans CJK SC', sans-serif" font-size="10" text-anchor="middle">温柔回忆</text>

  <circle cx="490.0" cy="310.0" r="20.0" fill="#BA68C8" filter="url(#shadow)"/>
  <text x="490.0" y="348" fill="rgba(255,255,255,0.8)" font-family="'Noto Sans CJK SC', sans-serif" font-size="10" text-anchor="middle">奢华空虚</text>

  <text x="400.0" y="375" fill="rgba(255,255,255,0.6)" font-family="'Noto Sans CJK SC', sans-serif" font-size="11" text-anchor="middle">索菲亚粉调 / 迷失东京蓝 / 少女柔粉色 / 少女忧伤 / 迷失孤独</text>
</svg>