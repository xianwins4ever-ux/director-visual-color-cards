<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB300;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#3E2723;stop-opacity:0.95" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="400" fill="url(#bg)"/>
  
  <!-- 标题区 -->
  <text x="40" y="60" fill="white" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="28" font-weight="bold">阿里·艾斯特</text>
  <text x="40" y="90" fill="rgba(255,255,255,0.7)" font-family="Arial, sans-serif" font-size="16">AriAster</text>
  <text x="40" y="115" fill="rgba(255,255,255,0.5)" font-family="'Noto Sans CJK SC', sans-serif" font-size="12">06_超现实梦幻与心理畸变 · 美国 · 1986-</text>

  <!-- 主色 1 -->
  <rect x="40.0" y="160" width="118.0" height="80" fill="#FFB300" filter="url(#shadow)"/>
  <text x="100.0" y="190" fill="#000000" font-family="Arial, monospace" font-size="11" text-anchor="middle" font-weight="bold">#FFB300</text>
  <text x="100.0" y="210" fill="#000000" font-family="'Noto Sans CJK SC', sans-serif" font-size="10" text-anchor="middle">仲夏夜金</text>
  <text x="100.0" y="225" fill="#000000" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" opacity="0.8">20%</text>

  <!-- 主色 2 -->
  <rect x="160.0" y="160" width="118.0" height="80" fill="#8D6E63" filter="url(#shadow)"/>
  <text x="220.0" y="190" fill="#ffffff" font-family="Arial, monospace" font-size="11" text-anchor="middle" font-weight="bold">#8D6E63</text>
  <text x="220.0" y="210" fill="#ffffff" font-family="'Noto Sans CJK SC', sans-serif" font-size="10" text-anchor="middle">木屋棕</text>
  <text x="220.0" y="225" fill="#ffffff" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" opacity="0.8">18%</text>

  <!-- 主色 3 -->
  <rect x="280.0" y="160" width="118.0" height="80" fill="#33691E" filter="url(#shadow)"/>
  <text x="340.0" y="190" fill="#ffffff" font-family="Arial, monospace" font-size="11" text-anchor="middle" font-weight="bold">#33691E</text>
  <text x="340.0" y="210" fill="#ffffff" font-family="'Noto Sans CJK SC', sans-serif" font-size="10" text-anchor="middle">青草绿</text>
  <text x="340.0" y="225" fill="#ffffff" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" opacity="0.8">16%</text>

  <!-- 主色 4 -->
  <rect x="400.0" y="160" width="118.0" height="80" fill="#B71C1C" filter="url(#shadow)"/>
  <text x="460.0" y="190" fill="#ffffff" font-family="Arial, monospace" font-size="11" text-anchor="middle" font-weight="bold">#B71C1C</text>
  <text x="460.0" y="210" fill="#ffffff" font-family="'Noto Sans CJK SC', sans-serif" font-size="10" text-anchor="middle">血暗红</text>
  <text x="460.0" y="225" fill="#ffffff" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" opacity="0.8">14%</text>

  <!-- 主色 5 -->
  <rect x="520.0" y="160" width="118.0" height="80" fill="#FFF9C4" filter="url(#shadow)"/>
  <text x="580.0" y="190" fill="#000000" font-family="Arial, monospace" font-size="11" text-anchor="middle" font-weight="bold">#FFF9C4</text>
  <text x="580.0" y="210" fill="#000000" font-family="'Noto Sans CJK SC', sans-serif" font-size="10" text-anchor="middle">日光黄</text>
  <text x="580.0" y="225" fill="#000000" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" opacity="0.8">14%</text>

  <!-- 主色 6 -->
  <rect x="640.0" y="160" width="118.0" height="80" fill="#3E2723" filter="url(#shadow)"/>
  <text x="700.0" y="190" fill="#ffffff" font-family="Arial, monospace" font-size="11" text-anchor="middle" font-weight="bold">#3E2723</text>
  <text x="700.0" y="210" fill="#ffffff" font-family="'Noto Sans CJK SC', sans-serif" font-size="10" text-anchor="middle">暗棕黑</text>
  <text x="700.0" y="225" fill="#ffffff" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" opacity="0.8">18%</text>

  <text x="400.0" y="275" fill="rgba(255,255,255,0.8)" font-family="'Noto Sans CJK SC', sans-serif" font-size="13" text-anchor="middle">情绪色板</text>

  <circle cx="310.0" cy="310.0" r="20.0" fill="#FFB300" filter="url(#shadow)"/>
  <text x="310.0" y="348" fill="rgba(255,255,255,0.8)" font-family="'Noto Sans CJK SC', sans-serif" font-size="10" text-anchor="middle">日光恐惧</text>

  <circle cx="370.0" cy="310.0" r="20.0" fill="#8D6E63" filter="url(#shadow)"/>
  <text x="370.0" y="348" fill="rgba(255,255,255,0.8)" font-family="'Noto Sans CJK SC', sans-serif" font-size="10" text-anchor="middle">家庭压抑</text>

  <circle cx="430.0" cy="310.0" r="20.0" fill="#B71C1C" filter="url(#shadow)"/>
  <text x="430.0" y="348" fill="rgba(255,255,255,0.8)" font-family="'Noto Sans CJK SC', sans-serif" font-size="10" text-anchor="middle">血腥暴力</text>

  <circle cx="490.0" cy="310.0" r="20.0" fill="#33691E" filter="url(#shadow)"/>
  <text x="490.0" y="348" fill="rgba(255,255,255,0.8)" font-family="'Noto Sans CJK SC', sans-serif" font-size="10" text-anchor="middle">自然恐怖</text>

  <text x="400.0" y="375" fill="rgba(255,255,255,0.6)" font-family="'Noto Sans CJK SC', sans-serif" font-size="11" text-anchor="middle">日光恐怖色 / 民俗暖黄 / 木屋棕调 / 日光恐怖 / 家庭创伤</text>
</svg>